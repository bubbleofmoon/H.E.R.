[package]
name = "her-memory"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[features]
parity-clock = []

[dependencies]
fastembed = { version = "=7.7.1", default-features = false, features = ["ort-load-dynamic"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "=0.1.9"

[dev-dependencies]
base64 = "0.22"
