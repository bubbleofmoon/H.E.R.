name: checks
# Pull-request and main checks on free standard GitHub-hosted runners. CI is the merge gate for every
# target it runs; only native, elevated and production-adjacent gates stay local
# (docs/agents/rust-validation.md). Never attach a self-hosted runner to this repository.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
    defaults:
      run:
        shell: bash
        working-directory: /tmp
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: /tmp/her
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Fetch source and base
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
          if [ -n "$BASE_SHA" ] && [ -n "${BASE_SHA//0/}" ]; then
            git -C "$PUBLIC_TREE" fetch --depth=1 origin "$BASE_SHA" || true
          fi
      - name: Classify changed paths
        id: classify
        run: |
          python -I "$PUBLIC_TREE/scripts/ci/classify-changes.py" \
            --repo "$PUBLIC_TREE" \
            --base "$BASE_SHA" \
            --head "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
  scans:
    name: scans (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            base: /tmp
            tree: /tmp/her
          - os: windows-2022
            base: C:/
            tree: C:/her-ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.base }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: ${{ matrix.tree }}
    steps:
      # Long-form path on the checkout's drive: RUNNER_TEMP is a short name on D:.
      - name: Use long-form Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          mkdir -p "${PUBLIC_TREE}-temp"
          echo "TEMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
          echo "TMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
      # The tentative repository name ends with a dot, which Win32 paths reject.
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Repository checks and scans
        run: |
          cd "$PUBLIC_TREE"
          python -I scripts/ci/install-gitleaks.py "$RUNNER_TEMP/her-gitleaks"
          HER_GITLEAKS="$RUNNER_TEMP/her-gitleaks/gitleaks"
          if [ "$RUNNER_OS" = Windows ]; then HER_GITLEAKS="$HER_GITLEAKS.exe"; fi
          export HER_GITLEAKS
          python -I scripts/ci/run-scans.py
          python -I scripts/scan-public.py
          "$HER_GITLEAKS" dir . --config .gitleaks.toml --redact --no-banner
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -File scripts/lifecycle/test-ps-count.ps1
          fi
  ui-build:
    name: ui-build (ubuntu-24.04)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: /tmp
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: /tmp/her
    steps:
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Toolchains
        run: |
          python "$PUBLIC_TREE/scripts/ci/install-node.py" "$RUNNER_TEMP/her-node"
          echo "$RUNNER_TEMP/her-node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/her-node" >> "$GITHUB_PATH"
      - name: Build console UI (her-ui)
        run: |
          cd "$PUBLIC_TREE/her-ui"
          npm ci
          npm run typecheck
          npm run build
      - name: Upload console UI (her-ui)
        uses: actions/upload-artifact@v4
        with:
          name: her-ui-dist
          path: ${{ env.PUBLIC_TREE }}/her-ui/dist
          retention-days: 1
          if-no-files-found: error
  # Formatting and clippy on both OSes; report-only for now (the job stays green, the output is in the log).
  lint:
    name: lint (${{ matrix.os }})
    needs: [changes, ui-build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            base: /tmp
            tree: /tmp/her
            target: /tmp/her-target
            target_rel: ../../her-target
          - os: windows-2022
            base: C:/
            tree: C:/her-ci
            target: C:/her-ci-target
            target_rel: ../../her-ci-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.base }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: ${{ matrix.tree }}
      CARGO_TARGET_DIR: ${{ matrix.target }}
      HER_REQUIRE_UI_DIST: '1'
    steps:
      - name: Use long-form Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          mkdir -p "${PUBLIC_TREE}-temp"
          echo "TEMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
          echo "TMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Download console UI (her-ui)
        uses: actions/download-artifact@v4
        with:
          name: her-ui-dist
          path: ${{ env.PUBLIC_TREE }}/her-ui/dist
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache joins workspace and target: relative to the tree's her directory this is CARGO_TARGET_DIR.
          workspaces: ${{ env.PUBLIC_TREE }}/her -> ${{ matrix.target_rel }}
          key: lint-${{ matrix.os }}
          cache-on-failure: true
      - name: Format and clippy (report-only)
        run: |
          set +e
          lint_crate() {
            local crate=$1 code count
            shift
            (cd "$PUBLIC_TREE/$crate" && cargo fmt --all --check)
            echo "fmt check $crate exit $?"
            (cd "$PUBLIC_TREE/$crate" && cargo clippy --workspace --all-targets "$@" 2>&1) | tee "$RUNNER_TEMP/clippy-$crate.log"
            code=${PIPESTATUS[0]}
            echo "clippy $crate exit $code"
            if [ "$code" -ne 0 ]; then
              echo "CLIPPY WARNINGS $crate (${RUNNER_OS}): incomplete, clippy exit $code"
            else
              # One line per warning; the per-crate "generated N warnings" summaries are not warnings.
              count=$(grep -E '^warning: ' "$RUNNER_TEMP/clippy-$crate.log" | grep -Ecv 'generated [0-9]+ warnings?')
              echo "CLIPPY WARNINGS $crate (${RUNNER_OS}): $count"
            fi
          }
          # Features match the test commands in scripts/ci/run-tests.py; her-memory is its own crate.
          lint_crate her --features parity-clock,release-test-keys
          lint_crate her-memory
  # Linux test shards run on every pull request and every push to main.
  tests:
    name: tests (ubuntu-24.04, shard ${{ matrix.shard }}/5)
    needs: [changes, ui-build]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: /tmp
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: /tmp/her
      CARGO_TARGET_DIR: /tmp/her-target
      CI_EVIDENCE: /tmp/her-evidence
      HER_REQUIRE_UI_DIST: '1'
    steps:
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Toolchains
        run: |
          python "$PUBLIC_TREE/scripts/ci/install-node.py" "$RUNNER_TEMP/her-node"
          echo "$RUNNER_TEMP/her-node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/her-node" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/her-node/bin:$RUNNER_TEMP/her-node:$PATH"
          node --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          python --version
      - name: Download console UI (her-ui)
        uses: actions/download-artifact@v4
        with:
          name: her-ui-dist
          path: ${{ env.PUBLIC_TREE }}/her-ui/dist
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache joins workspace and target: relative to /tmp/her/her this is /tmp/her-target (CARGO_TARGET_DIR).
          workspaces: ${{ env.PUBLIC_TREE }}/her -> ../../her-target
          key: ubuntu-24.04-shard${{ matrix.shard }}
          cache-on-failure: true
      - name: Build and test shard (known red reported separately)
        run: |
          cd "$PUBLIC_TREE"
          export HER_INSTALL_ROOT="$CI_EVIDENCE/unused-install-root"
          python -I scripts/ci/run-tests.py --shard ${{ matrix.shard }}/5 --known-red scripts/ci/known-red.txt
      - name: Upload CI evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-ubuntu-24.04-${{ matrix.shard }}
          path: ${{ env.CI_EVIDENCE }}
          retention-days: 7
  dsh-contract:
    name: DSH credential contract (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # This fixture needs unprivileged user and network namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PUBLIC_TREE: /tmp/her
      CARGO_TARGET_DIR: /tmp/her-target
    steps:
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Toolchains
        run: |
          python "$PUBLIC_TREE/scripts/ci/install-node.py" "$RUNNER_TEMP/her-node"
          echo "$RUNNER_TEMP/her-node/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PUBLIC_TREE }}/her -> ../../her-target
          key: dsh-contract-ubuntu-22.04
          cache-on-failure: true
      - name: Run the DSH credential contract for all listed versions
        run: python -I "$PUBLIC_TREE/scripts/ci/dsh-contract.py"
  # Windows test shards run on every push to main only; a pull request runs scans on Windows and the Linux shards.
  tests-windows:
    name: tests (windows-2022, shard ${{ matrix.shard }}/5)
    needs: [changes, ui-build]
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: C:/
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: C:/her-ci
      CARGO_TARGET_DIR: C:/her-ci-target
      CI_EVIDENCE: C:/her-ci-evidence
      HER_REQUIRE_UI_DIST: '1'
    steps:
      # Long-form path on the checkout's drive: RUNNER_TEMP is a short name on D:,
      # and fixtures rename between the temporary folder and the tree.
      - name: Use long-form Windows temporary directory
        run: |
          mkdir -p "${PUBLIC_TREE}-temp"
          echo "TEMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
          echo "TMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
      - name: Toolchains
        run: |
          python "$PUBLIC_TREE/scripts/ci/install-node.py" "$RUNNER_TEMP/her-node"
          echo "$RUNNER_TEMP/her-node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/her-node" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/her-node/bin:$RUNNER_TEMP/her-node:$PATH"
          node --version
          rustup toolchain install stable --profile minimal
          rustup default stable
          python --version
      - name: Download console UI (her-ui)
        uses: actions/download-artifact@v4
        with:
          name: her-ui-dist
          path: ${{ env.PUBLIC_TREE }}/her-ui/dist
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache joins workspace and target: relative to C:/her-ci/her this is C:/her-ci-target (CARGO_TARGET_DIR).
          workspaces: ${{ env.PUBLIC_TREE }}/her -> ../../her-ci-target
          key: windows-2022-shard${{ matrix.shard }}
          cache-on-failure: true
      - name: Build and test shard (known red reported separately)
        run: |
          cd "$PUBLIC_TREE"
          export HER_INSTALL_ROOT="$CI_EVIDENCE/unused-install-root"
          python -I scripts/ci/run-tests.py --shard ${{ matrix.shard }}/5 --known-red scripts/ci/known-red.txt
      - name: Windows launcher checks
        if: matrix.shard == 1
        run: |
          cd "$PUBLIC_TREE"
          export HER_TEST_CLI="$CARGO_TARGET_DIR/debug/her-cli.exe"
          export HER_INSTALL_ROOT="$CI_EVIDENCE/unused-install-root"
          powershell.exe -NoProfile -File scripts/lifecycle/test-ps-count.ps1
          powershell.exe -NoProfile -File scripts/lifecycle/test-external-path.ps1
      - name: Upload CI evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-windows-2022-${{ matrix.shard }}
          path: ${{ env.CI_EVIDENCE }}
          retention-days: 7
  # Always-run merge-gate aggregator so branch rulesets can require one stable check across code and docs-only PRs.
  gate:
    name: checks-gate
    needs: [changes, scans, ui-build, lint, tests, dsh-contract]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CODE_CHANGED: ${{ needs.changes.outputs.code }}
      SCANS_RESULT: ${{ needs.scans.result }}
      UI_BUILD_RESULT: ${{ needs.ui-build.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
      DSH_CONTRACT_RESULT: ${{ needs.dsh-contract.result }}
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          echo "changes=$CHANGES_RESULT code=$CODE_CHANGED scans=$SCANS_RESULT ui-build=$UI_BUILD_RESULT lint=$LINT_RESULT tests=$TESTS_RESULT dsh-contract=$DSH_CONTRACT_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "FAIL: changes job did not succeed ($CHANGES_RESULT)" >&2
            exit 1
          fi
          if [ "$SCANS_RESULT" != "success" ]; then
            echo "FAIL: scans job did not succeed ($SCANS_RESULT)" >&2
            exit 1
          fi
          if [ "$CODE_CHANGED" = "false" ]; then
            if [ "$UI_BUILD_RESULT" != "skipped" ] && [ "$UI_BUILD_RESULT" != "success" ]; then
              echo "FAIL: ui-build job unexpected result on docs-only change ($UI_BUILD_RESULT)" >&2
              exit 1
            fi
            if [ "$LINT_RESULT" != "skipped" ] && [ "$LINT_RESULT" != "success" ]; then
              echo "FAIL: lint job unexpected result on docs-only change ($LINT_RESULT)" >&2
              exit 1
            fi
            if [ "$TESTS_RESULT" != "skipped" ] && [ "$TESTS_RESULT" != "success" ]; then
              echo "FAIL: tests job unexpected result on docs-only change ($TESTS_RESULT)" >&2
              exit 1
            fi
            if [ "$DSH_CONTRACT_RESULT" != "skipped" ] && [ "$DSH_CONTRACT_RESULT" != "success" ]; then
              echo "FAIL: dsh-contract job unexpected result on docs-only change ($DSH_CONTRACT_RESULT)" >&2
              exit 1
            fi
            echo "PASS: docs-only checks green"
            exit 0
          fi
          if [ "$UI_BUILD_RESULT" != "success" ]; then
            echo "FAIL: ui-build job did not succeed ($UI_BUILD_RESULT)" >&2
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ]; then
            echo "FAIL: lint job did not succeed ($LINT_RESULT)" >&2
            exit 1
          fi
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "FAIL: tests job did not succeed ($TESTS_RESULT)" >&2
            exit 1
          fi
          if [ "$DSH_CONTRACT_RESULT" != "success" ]; then
            echo "FAIL: dsh-contract job did not succeed ($DSH_CONTRACT_RESULT)" >&2
            exit 1
          fi
          echo "PASS: code checks green"
