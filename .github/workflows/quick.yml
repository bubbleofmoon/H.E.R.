name: quick
run-name: quick ${{ inputs.os }} target=${{ inputs.target }} filter=${{ inputs.filter }}${{ inputs.sha && format(' sha={0}', inputs.sha) || '' }}
# Batch test targets per step and OS. Dispatch check and lint separately. The coordinator dispatches and waits for runs.
# A second run with the same ref, target, os, filter and sha cancels the first. `-f sha=<commit>` runs an older commit instead of the ref head (a red receipt); the step fails unless it is an ancestor of the head.
# Two more targets run cargo directly, each alone (not combined with others): `check` is `cargo check --workspace --all-targets`;
# `lint` is `cargo fmt --all --check` plus `cargo clippy --workspace --all-targets` (report-only for now) and uploads the
# `cargo fmt --all` result as artifact `fmt-patch` and the `cargo clippy --fix` result, on a clean tree, as artifact `clippy-fix-patch`
# (both always uploaded, empty when there is nothing to change): `gh run download <id> -n fmt-patch`, then apply only ticket-authorized hunks for owned files (see docs/agents/rust-validation.md).
# `console_ui` also runs alone. It builds the console fixture candidate and uploads the Playwright report.
# The CI-first gate is checks.yml on the pull request; this job never gates a merge.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'run-tests.py target name(s), comma-separated (unit, herupdate, memory_library, an her/tests stem, scripts, dsh_contract), or alone: lint, check, console_ui'
        required: true
      filter:
        description: 'optional libtest name filter'
        required: false
        default: ''
      os:
        description: 'linux or windows'
        required: false
        default: linux
        type: choice
        options: [linux, windows]
      sha:
        description: 'optional commit to run instead of the ref head; must be an ancestor of the ref head'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: quick-${{ github.ref }}-${{ inputs.target }}-${{ inputs.os }}-${{ inputs.filter }}-${{ inputs.sha }}
  cancel-in-progress: true
jobs:
  quick:
    name: quick (${{ inputs.os }}, ${{ inputs.target }})
    # The DSH contract needs unprivileged user and network namespaces.
    runs-on: ${{ inputs.os == 'windows' && 'windows-2022' || (contains(format(',{0},', inputs.target), ',dsh_contract,') && 'ubuntu-22.04') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PUBLIC_TREE: ${{ inputs.os == 'windows' && 'C:/her-ci' || '/tmp/her' }}
      CARGO_TARGET_DIR: ${{ inputs.os == 'windows' && 'C:/her-ci-target' || '/tmp/her-target' }}
      CI_EVIDENCE: ${{ inputs.os == 'windows' && 'C:/her-ci-evidence' || '/tmp/her-evidence' }}
      QUICK_TARGET: ${{ inputs.target }}
      QUICK_FILTER: ${{ inputs.filter }}
      QUICK_SHA: ${{ inputs.sha }}
    steps:
      - name: Use long-form Windows temporary directory
        if: runner.os == 'Windows'
        run: |
          mkdir -p "${PUBLIC_TREE}-temp"
          echo "TEMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
          echo "TMP=${PUBLIC_TREE}-temp" >> "$GITHUB_ENV"
      - name: Fetch source
        run: |
          git init "$PUBLIC_TREE"
          git -C "$PUBLIC_TREE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -z "$QUICK_SHA" ]; then
            git -C "$PUBLIC_TREE" fetch --depth=1 origin "$GITHUB_SHA"
            git -C "$PUBLIC_TREE" checkout --detach FETCH_HEAD
          else
            # An older commit of the ref: its history is needed to prove the ancestry.
            if ! printf '%s' "$QUICK_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
              echo "::error::the sha input is not a commit sha (7 to 40 hex digits)"
              exit 1
            fi
            git -C "$PUBLIC_TREE" fetch --no-tags origin "$GITHUB_SHA"
            if ! full=$(git -C "$PUBLIC_TREE" rev-parse --verify --quiet "$QUICK_SHA^{commit}") \
                || ! git -C "$PUBLIC_TREE" merge-base --is-ancestor "$full" "$GITHUB_SHA"; then
              echo "::error::sha $QUICK_SHA is not an ancestor of $GITHUB_REF ($GITHUB_SHA)"
              exit 1
            fi
            git -C "$PUBLIC_TREE" checkout --detach "$full"
          fi
      - name: Toolchains
        run: |
          python "$PUBLIC_TREE/scripts/ci/install-node.py" "$RUNNER_TEMP/her-node"
          echo "$RUNNER_TEMP/her-node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/her-node" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$QUICK_TARGET" = lint ]; then rustup component add rustfmt clippy; fi
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache joins workspace and target; relative so it resolves to CARGO_TARGET_DIR on both OSes.
          workspaces: ${{ env.PUBLIC_TREE }}/her -> ${{ inputs.os == 'windows' && '../../her-ci-target' || '../../her-target' }}
          key: quick-${{ inputs.os }}${{ contains(format(',{0},', inputs.target), ',dsh_contract,') && '-dsh-contract' || '' }}
          cache-on-failure: true
      - name: Build and run the named target
        if: inputs.target != 'lint' && inputs.target != 'check' && inputs.target != 'console_ui'
        run: |
          cd "$PUBLIC_TREE"
          export HER_INSTALL_ROOT="$CI_EVIDENCE/unused-install-root"
          args=(--only "$QUICK_TARGET")
          if [ -n "$QUICK_FILTER" ]; then args+=(--filter "$QUICK_FILTER"); fi
          python -I scripts/ci/run-tests.py "${args[@]}"
      - name: Build the console fixture candidate
        if: inputs.target == 'console_ui'
        id: console_candidate
        run: |
          if [ -n "$QUICK_FILTER" ]; then
            echo '::error::console_ui runs its entire matrix and takes no filter'
            exit 1
          fi
          cd "$PUBLIC_TREE/her-ui"
          npm ci
          npm run build
          export HER_REQUIRE_UI_DIST=1
          echo "HER_REQUIRE_UI_DIST=1" >> "$GITHUB_ENV"
          cd "$PUBLIC_TREE/her"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = Windows ]; then
            cargo build --locked --features release-test-keys --bin her-cli --bin her
          else
            cargo build --locked --features release-test-keys --bin her-cli
          fi
      - name: Install Playwright and Chromium (Linux)
        if: inputs.target == 'console_ui'
        run: |
          cd "$PUBLIC_TREE/her/tests/ui"
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "$RUNNER_OS" != Windows ]; then
            npx --no-install playwright install --with-deps chromium
          fi
      - name: Capture the console and walk its controls
        if: inputs.target == 'console_ui'
        env:
          HER_UI_COMMIT: ${{ steps.console_candidate.outputs.commit }}
        run: |
          cd "$PUBLIC_TREE/her/tests/ui"
          export HER_UI_OUTPUT="$CI_EVIDENCE"
          export HER_TEST_CLI="$CARGO_TARGET_DIR/debug/her-cli"
          if [ "$RUNNER_OS" = Windows ]; then HER_TEST_CLI+=.exe; fi
          npm test
      - name: Upload console UI report
        if: always() && steps.console_candidate.outputs.commit != ''
        uses: actions/upload-artifact@v4
        with:
          name: console-ui-${{ steps.console_candidate.outputs.commit }}-${{ inputs.os }}
          path: ${{ env.CI_EVIDENCE }}/console-ui-${{ steps.console_candidate.outputs.commit }}-${{ inputs.os }}
          if-no-files-found: ignore
      - name: Compile check
        if: inputs.target == 'check'
        run: |
          # Features match the test commands in scripts/ci/run-tests.py; her-memory is its own crate.
          (cd "$PUBLIC_TREE/her" && cargo check --workspace --all-targets --features parity-clock,release-test-keys)
          (cd "$PUBLIC_TREE/her-memory" && cargo check --workspace --all-targets)
      - name: Format and clippy (report-only)
        if: inputs.target == 'lint'
        run: |
          mkdir -p "$CI_EVIDENCE"
          set +e
          lint_crate() {
            local crate=$1 code count
            shift
            (cd "$PUBLIC_TREE/$crate" && cargo fmt --all --check)
            echo "fmt check $crate exit $?"
            (cd "$PUBLIC_TREE/$crate" && cargo clippy --workspace --all-targets "$@" 2>&1) | tee "$CI_EVIDENCE/clippy-$crate.log"
            code=${PIPESTATUS[0]}
            echo "clippy $crate exit $code"
            if [ "$code" -ne 0 ]; then
              echo "CLIPPY WARNINGS $crate (${RUNNER_OS}): incomplete, clippy exit $code"
            else
              # One line per warning; the per-crate "generated N warnings" summaries are not warnings.
              count=$(grep -E '^warning: ' "$CI_EVIDENCE/clippy-$crate.log" | grep -Ecv 'generated [0-9]+ warnings?')
              echo "CLIPPY WARNINGS $crate (${RUNNER_OS}): $count"
            fi
          }
          # Features match the test commands in scripts/ci/run-tests.py; her-memory is its own crate.
          lint_crate her --features parity-clock,release-test-keys
          lint_crate her-memory
          # Rewrite with cargo fmt and keep the result as a patch for the worker to apply.
          (cd "$PUBLIC_TREE/her" && cargo fmt --all)
          (cd "$PUBLIC_TREE/her-memory" && cargo fmt --all)
          (cd "$PUBLIC_TREE" && git diff > "$CI_EVIDENCE/fmt.patch")
          echo "fmt patch bytes: $(wc -c < "$CI_EVIDENCE/fmt.patch")"
      - name: Upload fmt patch
        if: always() && inputs.target == 'lint'
        uses: actions/upload-artifact@v4
        with:
          name: fmt-patch
          path: ${{ env.CI_EVIDENCE }}/fmt.patch
          if-no-files-found: error
          retention-days: 3
      - name: Clippy suggestions as a patch (report-only)
        if: inputs.target == 'lint'
        run: |
          mkdir -p "$CI_EVIDENCE"
          : > "$CI_EVIDENCE/clippy-fix.patch"
          set +e
          # Start from the clean tree so this patch holds only clippy's own edits, apart from fmt.patch.
          git -C "$PUBLIC_TREE" checkout -- .
          (cd "$PUBLIC_TREE/her" && cargo clippy --fix --allow-dirty --allow-no-vcs --features parity-clock,release-test-keys --all-targets)
          echo "clippy --fix exit $?"
          (cd "$PUBLIC_TREE" && git diff > "$CI_EVIDENCE/clippy-fix.patch")
          echo "clippy-fix patch bytes: $(wc -c < "$CI_EVIDENCE/clippy-fix.patch")"
      - name: Upload clippy-fix patch
        if: always() && inputs.target == 'lint'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-fix-patch
          path: ${{ env.CI_EVIDENCE }}/clippy-fix.patch
          if-no-files-found: error
          retention-days: 3
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-evidence
          path: ${{ env.CI_EVIDENCE }}
          retention-days: 3
